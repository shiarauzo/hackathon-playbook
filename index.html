<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arándano · Eventos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#15131f;font-family:Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:18px 28px;background:#fff;border-bottom:1px solid #e7e5ef}
.logo{font-weight:800;font-size:22px;color:#3b2a8f}.logo span{color:#6d5bd0}header .sp{flex:1}
button{font:inherit;border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer}button.p{background:#3b2a8f;color:#fff;border-color:#3b2a8f}
main{padding:28px;max-width:1200px;margin:auto}h1{margin:0 0 20px;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:#fff;border:1px solid #e7e5ef;border-radius:16px;padding:22px;cursor:pointer;transition:.15s}.card:hover{box-shadow:0 6px 24px #3b2a8f1a;transform:translateY(-2px)}
.card h3{margin:0 0 4px;font-size:20px}.muted{color:#777;font-size:14px}.big{font-size:40px;font-weight:800;color:#3b2a8f;margin:14px 0 6px}
.bar{height:8px;background:#eceaf5;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6d5bd0,#3b2a8f)}
.empty{border:2px dashed #d7d3ea;border-radius:16px;padding:40px;text-align:center;color:#888}
.ev{display:grid;grid-template-columns:280px 1fr;gap:22px}.lib{background:#fff;border:1px solid #e7e5ef;border-radius:16px;padding:16px;align-self:start;position:sticky;top:16px}
.lib h4{margin:0 0 4px}.chip{padding:10px 12px;border:1px solid #e7e5ef;border-radius:10px;margin-top:8px;cursor:grab;background:#faf9ff;display:flex;justify-content:space-between}.chip.used{opacity:.4}
.drop{min-height:200px;border-radius:16px}.drop.over{outline:2px dashed #6d5bd0;background:#f1eefc}
.blk{background:#fff;border:1px solid #e7e5ef;border-radius:14px;margin-bottom:14px}.bh{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:grab}
.bh b{flex:1}.bh .bar{width:120px}.x{border:0;background:none;color:#999;padding:4px 8px}
.task{padding:0 16px 10px}.task h5{margin:8px 0 4px;font-size:14px;color:#444}label{display:block;padding:4px 0;cursor:pointer;font-size:14px}label.d{color:#aaa;text-decoration:line-through}input{accent-color:#3b2a8f;margin-right:8px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.top h1{margin:0;flex:1}
@media(max-width:800px){.ev{grid-template-columns:1fr}.lib{position:static}}
</style></head><body>
<header><div class="logo">ar<span>á</span>ndano</div><div class="sp"></div><button onclick="exp()">Exportar</button><button onclick="document.getElementById('f').click()">Importar</button><input id="f" type="file" accept=".json" hidden onchange="imp(this)"></header>
<main id="m"></main>
<script src="data.js"></script>
<script>
let D=JSON.parse(localStorage.getItem('arandano')||'{"events":[]}'),view=location.hash.slice(1);
const save=()=>localStorage.setItem('arandano',JSON.stringify(D)),uid=()=>Math.random().toString(36).slice(2,9);
const st=items=>{let a=0,d=0;items.forEach(b=>b.k.forEach(t=>t[1].forEach(m=>{a++;if(m.d)d++})));return[d,a,a?Math.round(d/a*100):0]};
function newEv(){const n=prompt('Nombre del evento','Taller de Grokbot');if(!n)return;const e={id:uid(),name:n,date:prompt('Fecha (opcional)','')||'',blocks:[]};D.events.push(e);save();open_(e.id)}
function open_(id){location.hash=id}
window.onhashchange=()=>{view=location.hash.slice(1);draw()};
function home(){const m=document.getElementById('m');m.innerHTML=`<div class="top"><h1>Mis eventos</h1><button class="p" onclick="newEv()">+ Nuevo evento</button></div>`+(D.events.length?`<div class="grid">${D.events.map(e=>{const[d,a,p]=st(e.blocks);return`<div class="card" onclick="open_('${e.id}')"><h3>${e.name}</h3><div class="muted">${e.date||'Sin fecha'} · ${e.blocks.length} grupos</div><div class="big">${p}%</div><div class="bar"><i style="width:${p}%"></i></div><div class="muted" style="margin-top:8px">${d} de ${a} microtareas</div></div>`}).join('')}</div>`:`<div class="empty">Aún no tienes eventos. Crea el primero con “+ Nuevo evento”.</div>`)}
function ev(e){const used=new Set(e.blocks.map(b=>b.t));const[d,a,p]=st(e.blocks);
document.getElementById('m').innerHTML=`<div class="top"><button onclick="location.hash=''">← Eventos</button><h1>${e.name}</h1><span class="muted">${p}% · ${d}/${a}</span><button onclick="ren('${e.id}')">Renombrar</button><button onclick="del('${e.id}')">Eliminar</button></div><div class="bar" style="margin-bottom:22px"><i style="width:${p}%"></i></div>
<div class="ev"><div class="lib"><h4>Grupos</h4><div class="muted">Arrástralos al evento o haz clic para agregar</div>${G.map((g,i)=>`<div class="chip ${used.has(g.t)?'used':''}" draggable="true" ondragstart="event.dataTransfer.setData('lib',${i})" onclick="add('${e.id}',${i})"><span>${g.t}</span><span class="muted">+</span></div>`).join('')}<button style="width:100%;margin-top:12px" onclick="addAll('${e.id}')">Agregar todos</button></div>
<div class="drop" id="dz">${e.blocks.length?'':'<div class="empty">Arrastra aquí los grupos que necesita este evento</div>'}${e.blocks.map((b,bi)=>{const[bd,ba,bp]=st([b]);return`<div class="blk" draggable="true" ondragstart="event.dataTransfer.setData('blk',${bi})" ondragover="event.preventDefault()" ondrop="dropOn(event,'${e.id}',${bi})"><div class="bh"><span class="muted">⋮⋮</span><b>${b.t}</b><span class="muted">${bd}/${ba}</span><div class="bar"><i style="width:${bp}%"></i></div><button class="x" onclick="rm('${e.id}',${bi})">✕</button></div>${b.k.map((t,ti)=>`<div class="task"><h5>${t[0]}</h5>${t[1].length==1&&t[1][0].t==t[0]?'':''}${t[1].map((mt,mi)=>`<label class="${mt.d?'d':''}"><input type="checkbox" ${mt.d?'checked':''} onchange="tg('${e.id}',${bi},${ti},${mi})">${mt.t}</label>`).join('')}</div>`).join('')}</div>`}).join('')}</div></div>`;
const dz=document.getElementById('dz');dz.ondragover=x=>{x.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=x=>{dz.classList.remove('over');const l=x.dataTransfer.getData('lib');if(l!=='')add(e.id,+l)}}
const E=id=>D.events.find(e=>e.id==id);
function mk(i){const g=G[i];return{t:g.t,k:g.k.map(k=>[k[0],k[1].map(t=>({t,d:false}))])}}
function add(id,i){const e=E(id);if(e.blocks.some(b=>b.t==G[i].t))return;e.blocks.push(mk(i));save();draw()}
function addAll(id){G.forEach((_,i)=>{const e=E(id);if(!e.blocks.some(b=>b.t==G[i].t))e.blocks.push(mk(i))});save();draw()}
function dropOn(x,id,to){x.stopPropagation();x.preventDefault();const e=E(id),f=x.dataTransfer.getData('blk');if(f!==''){const[b]=e.blocks.splice(+f,1);e.blocks.splice(to,0,b)}else{const l=x.dataTransfer.getData('lib');if(l!==''&&!e.blocks.some(b=>b.t==G[+l].t))e.blocks.splice(to,0,mk(+l))}save();draw()}
function rm(id,bi){if(confirm('¿Quitar este grupo y su avance?')){E(id).blocks.splice(bi,1);save();draw()}}
function tg(id,bi,ti,mi){const m=E(id).blocks[bi].k[ti][1][mi];m.d=!m.d;save();draw()}
function ren(id){const n=prompt('Nuevo nombre',E(id).name);if(n){E(id).name=n;save();draw()}}
function del(id){if(confirm('¿Eliminar este evento?')){D.events=D.events.filter(e=>e.id!=id);save();location.hash=''}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)]));a.download='arandano-backup.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();draw()}catch{alert('Archivo inválido')}};r.readAsText(i.files[0])}
function draw(){const e=view&&E(view);e?ev(e):home()}draw();
</script></body></html>
